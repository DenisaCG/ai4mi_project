# FINAL model 0/2: the very base model, trained on ALL 40 labelled patients for 50 epochs (same budget as the other two final models), predicts the 20 test CTs.
# CV counterpart (held-out score): configs/full_cv4_enet_ce_50ep.yaml. Seeds 0-2 via --set seed=k. Needs retains: 0 (see docs/final_training.md).
# 4-fold cross-validation (30 train / 10 val patients per fold) on the full 40-patient SEGTHOR train set (labels 0-4).
# Starter model: ENet + cross-entropy over all classes on the course-default slices (256x256, per-volume min-max;
# no resampling, intensity normalisation or ROI crop). `fold: 4` means "4 folds": they run as full_cv4_enet_ce_fold0..3
# (runs/ and metrics/), each with its own sliced dataset. Split seed 0 (`preprocess.seed`) for every run; run seeds 0, 1, 2
# come from cv.job (`seed: 0` below is only the default), so there are 12 runs: fold_k/seed_s.
experiment: final_enet_ce_base
notes: Final run, the very base model (course-default ENet + CE, no preprocessing, 256x256 slices) on all 40 train+val patients, 50 epochs, last epoch, predicts the 20 test patients
seed: 0

data:
  preprocess: {source_dir: data/segthor_train_full, gt_version: corrected, retains: 0, fold: 0, seed: 0}
  source_pattern: null
  test_source_pattern: data/segthor_train_full/test/{patient}.nii.gz

model:
  name: enet
  kwargs: {kernels: 8, factor: 2}

loss:
  name: cross_entropy
  kwargs: {idk: [0, 1, 2, 3, 4]}

eval:
  classes: [1, 2, 3, 4]

wandb:
  mode: disabled

train:
  epochs: 50
  select_metric: train_dice_fg   # no val set: final model = last epoch
