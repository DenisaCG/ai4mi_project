# Same 4-fold cross-validation, preprocessing and loss as full_cv4_enet_dice_ce.yaml (40 patients, 30 train / 10 val per fold,
# split seed 0, run seeds 0-2 from cv.job); only the model changes: 2D U-Net with a frozen pretrained DINOv2 ViT-S/14 encoder
# (src/models/dino_unet.py) instead of the plain U-Net. Runs as full_cv4_dino_unet_dice_ce_fold0..3.
experiment: full_cv4_dino_unet_dice_ce
notes: "step 6 of the architecture comparison - 2D U-Net decoder (step-1 widths) on a frozen pretrained DINOv2 ViT-S/14 encoder, blocks 2/5/8/11 (Dino U-Net, arXiv:2508.20909; weights dinov2_vits14_pretrain.pth from torch.hub, /scratch-shared/$USER/torch_cache/hub/checkpoints/dinov2_vits14_pretrain.pth, sha256 b938bf1bc15cd2ec0feacfe3a1bb553fe8ea9ca46a7e1d8d00217f29aef60cd9) + trainable conv stem at full and half resolution + CE (all classes) + soft Dice (foreground), full preprocessing (median spacing + HU window + z-score + ROI crop/pad), 4-fold CV on the full 40-patient SEGTHOR train set. Hypothesis: ViT features are at 1/14 resolution, which may limit thin structures; the stem adds the high-resolution detail. Caveat: best_model.pkl pickles the hub-loaded ViT by reference to the dinov2 module, so unpickling it in a fresh process needs the cached repo (<torch_home>/hub/facebookresearch_dinov2_main) on sys.path; the pipeline itself rebuilds the model and loads best.pt."
seed: 0

data:
  preprocess: {source_dir: data/segthor_train_full, gt_version: corrected, retains: 10, fold: 4, seed: 0, resample: median, normalize: ct_window_zscore, crop: roi}
  source_pattern: data/segthor_train_full/train/{patient}/GT.nii.gz

model:
  name: dino_unet

loss:
  name: dice_ce
  kwargs:
    ce_idk: [0, 1, 2, 3, 4]   # CE sees background
    dice_idk: [1, 2, 3, 4]
    ce_weight: 1.0
    dice_weight: 1.0

eval:
  classes: [1, 2, 3, 4]

wandb:
  mode: disabled
