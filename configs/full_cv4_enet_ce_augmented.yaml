# Full40 BASE ENet+CE reference recipe; only joint online augmentation (rotation, scaling, shift; applied in that order, each p=0.5) differs.
# 4-fold cross-validation (30 train / 10 val patients per fold) on the full 40-patient SEGTHOR train set (labels 0-4).
# Starter model: ENet + cross-entropy over all classes on the course-default slices (256x256, per-volume min-max;
# no resampling, intensity normalisation or ROI crop). `fold: 4` means "4 folds": they run as full_cv4_enet_ce_fold0..3
# (runs/ and metrics/), each with its own sliced dataset. Split seed 0 (`preprocess.seed`) for every run; run seeds 0, 1, 2
# come from cv.job (`seed: 0` below is only the default), so there are 12 runs: fold_k/seed_s.
experiment: full_cv4_enet_ce_augmented
notes: Full40 BASE ENet+CE with joint training-slice rotation + scaling + shift
seed: 0

data:
  preprocess: {source_dir: data/segthor_train_full, gt_version: corrected, retains: 10, fold: 4, seed: 0}
  source_pattern: data/segthor_train_full/train/{patient}/GT.nii.gz
  augment:
    - {name: random_rotation, kwargs: {p: 0.5, degrees: [-10.0, 10.0], fill: 0.0}}
    - {name: random_scaling, kwargs: {p: 0.5, scales: [0.9, 1.1], fill: 0.0}}
    - {name: random_shift, kwargs: {p: 0.5, max_fraction: 0.1, fill: 0.0}}

model:
  name: enet
  kwargs: {kernels: 8, factor: 2}

loss:
  name: cross_entropy
  kwargs: {idk: [0, 1, 2, 3, 4]}

eval:
  classes: [1, 2, 3, 4]

wandb:
  mode: disabled
