# Full40 BASE ENet+CE reference recipe; only online CT noise differs.
experiment: full_cv4_enet_ce_gaussian_noise
notes: Full40 BASE ENet+CE with training-slice Gaussian CT noise only
seed: 0

data:
  preprocess: {source_dir: data/segthor_train_full, gt_version: corrected, retains: 10, fold: 4, seed: 0}
  source_pattern: data/segthor_train_full/train/{patient}/GT.nii.gz
  augment:
    - {name: gaussian_noise, kwargs: {p: 0.5, sigma: 0.00164}}  # ~8.9 HU at median Full40 raw-volume range; patient-specific approximation

model:
  name: enet
  kwargs: {kernels: 8, factor: 2}

loss:
  name: cross_entropy
  kwargs: {idk: [0, 1, 2, 3, 4]}

eval:
  classes: [1, 2, 3, 4]

wandb:
  mode: disabled
