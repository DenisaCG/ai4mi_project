# Full40 BASE ENet+CE reference recipe; only online scaling differs.
experiment: full_cv4_enet_ce_scaling
notes: Full40 BASE ENet+CE with mild training-slice scaling only
seed: 0

data:
  preprocess: {source_dir: data/segthor_train_full, gt_version: corrected, retains: 10, fold: 4, seed: 0}
  source_pattern: data/segthor_train_full/train/{patient}/GT.nii.gz
  augment:
    - {name: random_scaling, kwargs: {p: 0.5, scales: [0.9, 1.1], fill: 0.0}}  # BASE per-volume min-max lower endpoint

model:
  name: enet
  kwargs: {kernels: 8, factor: 2}

loss:
  name: cross_entropy
  kwargs: {idk: [0, 1, 2, 3, 4]}

eval:
  classes: [1, 2, 3, 4]

wandb:
  mode: disabled
