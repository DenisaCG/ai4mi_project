# Full40 CE(all)+Dice(fg) reference recipe; only joint online augmentation (rotation, scaling, shift; applied in that order, each p=0.5) differs.
# Same 4-fold cross-validation as full_cv4_enet_ce.yaml (40 patients, 30 train / 10 val per fold, split seed 0, run seeds 0-2 from cv.job),
# with the current recipe: ENet + CE (all classes) + soft Dice (foreground) and the full preprocessing stack (median spacing,
# HU window + z-score, ROI crop/pad). The window size T comes from each fold's 30 training patients, so it can differ per fold
# (see <dataset>/roi_crop.json). Runs as full_cv4_enet_dice_ce_fold0..3. Needs the dice_ce loss (src/losses/diceCE.py).
experiment: full_cv4_enet_dice_ce_augmented
notes: Full40 upgraded ENet Dice+CE with joint training-slice rotation + scaling + shift
seed: 0

data:
  preprocess: {source_dir: data/segthor_train_full, gt_version: corrected, retains: 10, fold: 4, seed: 0, resample: median, normalize: ct_window_zscore, crop: roi}
  source_pattern: data/segthor_train_full/train/{patient}/GT.nii.gz
  augment:
    - {name: random_rotation, kwargs: {p: 0.5, degrees: [-10.0, 10.0], fill: ct_window_low}}
    - {name: random_scaling, kwargs: {p: 0.5, scales: [0.9, 1.1], fill: ct_window_low}}
    - {name: random_shift, kwargs: {p: 0.5, max_fraction: 0.1, fill: ct_window_low}}

model:
  name: enet
  kwargs: {kernels: 8, factor: 2}

loss:
  name: dice_ce
  kwargs:
    ce_idk: [0, 1, 2, 3, 4]   # CE sees background
    dice_idk: [1, 2, 3, 4]
    ce_weight: 1.0
    dice_weight: 1.0

eval:
  classes: [1, 2, 3, 4]

wandb:
  mode: disabled
