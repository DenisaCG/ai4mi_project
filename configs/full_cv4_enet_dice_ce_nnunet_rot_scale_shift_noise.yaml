# Full40 CE(all)+Dice(fg) reference recipe; only nnU-Net-rate joint rotation + scaling + shift + noise differs.
experiment: full_cv4_enet_dice_ce_nnunet_rot_scale_shift_noise
notes: Full40 upgraded ENet Dice+CE with low-p joint rotation (+-10, p0.2), scaling (0.7-1.4, p0.2), 2% shift (p0.2) and Gaussian noise (sigma 0.05, p0.1)
seed: 0

data:
  preprocess: {source_dir: data/segthor_train_full, gt_version: corrected, retains: 10, fold: 4, seed: 0, resample: median, normalize: ct_window_zscore, crop: roi}
  source_pattern: data/segthor_train_full/train/{patient}/GT.nii.gz
  augment:
    - {name: random_rotation, kwargs: {p: 0.2, degrees: [-10.0, 10.0], fill: ct_window_low}}  # same mild range as the rotation arm; nnU-Net would use +-180 here, p matches nnU-Net
    - {name: random_scaling, kwargs: {p: 0.2, scales: [0.7, 1.4], fill: ct_window_low}}  # nnU-Net v2 default
    - {name: random_shift, kwargs: {p: 0.2, max_fraction: 0.02, fill: ct_window_low}}  # very minor (~6 px), not in nnU-Net
    - {name: gaussian_noise, kwargs: {p: 0.1, sigma: 0.05}}  # nnU-Net p=0.1; same sigma as the noise arm

model:
  name: enet
  kwargs: {kernels: 8, factor: 2}

loss:
  name: dice_ce
  kwargs:
    ce_idk: [0, 1, 2, 3, 4]
    dice_idk: [1, 2, 3, 4]
    ce_weight: 1.0
    dice_weight: 1.0

eval:
  classes: [1, 2, 3, 4]

wandb:
  mode: disabled
