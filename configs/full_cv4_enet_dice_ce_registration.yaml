# Full40 improved Dice+CE with the same train-only synthetic NIfTIs as BASE.
# The real fold's window, z-score, ROI, and validation remain unchanged.
experiment: full_cv4_enet_dice_ce_registration
notes: ENet + Dice CE, full preprocessing, 30 train-only registered volumes per fold
seed: 0

data:
  preprocess: {source_dir: data/segthor_train_full, gt_version: corrected, retains: 10, fold: 4, seed: 0, resample: median, normalize: ct_window_zscore, crop: roi}
  registration: {root: data/registration_full40, pairing_seed: 42}
  patient_regex: '((?:Patient_\d+|Synthetic_f\d+_\d+))_\d{4}'
  source_pattern: data/segthor_train_full/train/{patient}/GT.nii.gz

model:
  name: enet
  kwargs: {kernels: 8, factor: 2}

loss:
  name: dice_ce
  kwargs:
    ce_idk: [0, 1, 2, 3, 4]
    dice_idk: [1, 2, 3, 4]
    ce_weight: 1.0
    dice_weight: 1.0

eval:
  classes: [1, 2, 3, 4]

wandb:
  mode: disabled
