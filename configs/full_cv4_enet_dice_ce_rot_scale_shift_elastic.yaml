# Full40 CE(all)+Dice(fg) reference recipe; only the online augmentation differs (rot_scale_shift_elastic, no noise).
experiment: full_cv4_enet_dice_ce_rot_scale_shift_elastic
notes: Full40 upgraded ENet Dice+CE with rotation, scaling, shift (p0.5) plus elastic deformation (p0.5, torchvision ElasticTransform alpha 50, sigma 5)
seed: 0

data:
  preprocess: {source_dir: data/segthor_train_full, gt_version: corrected, retains: 10, fold: 4, seed: 0, resample: median, normalize: ct_window_zscore, crop: roi}
  source_pattern: data/segthor_train_full/train/{patient}/GT.nii.gz
  augment:
    - {name: random_rotation, kwargs: {p: 0.5, degrees: [-10.0, 10.0], fill: ct_window_low}}
    - {name: random_scaling, kwargs: {p: 0.5, scales: [0.9, 1.1], fill: ct_window_low}}
    - {name: random_shift, kwargs: {p: 0.5, max_fraction: 0.1, fill: ct_window_low}}
    - {name: random_elastic, kwargs: {p: 0.5, alpha: 50.0, sigma: 5.0, fill: ct_window_low}}

model:
  name: enet
  kwargs: {kernels: 8, factor: 2}

loss:
  name: dice_ce
  kwargs:
    ce_idk: [0, 1, 2, 3, 4]
    dice_idk: [1, 2, 3, 4]
    ce_weight: 1.0
    dice_weight: 1.0

eval:
  classes: [1, 2, 3, 4]

wandb:
  mode: disabled
