# Full40 ResEnc + DS U-Net Dice+CE with train-only offline 3D registration.
# The real fold cache and validation remain identical to full_cv4_resenc_ds_unet_dice_ce.yaml.
experiment: full_cv4_resenc_ds_unet_dice_ce_registration
notes: ResEnc + DS U-Net Dice+CE, full preprocessing, 30 train-only registered volumes per fold
seed: 0

data:
  preprocess: {source_dir: data/segthor_train_full, gt_version: corrected, retains: 10, fold: 4, seed: 0, resample: median, normalize: ct_window_zscore, crop: roi}
  registration: {root: data/registration_full40, pairing_seed: 42}
  patient_regex: '((?:Patient_\d+|Synthetic_f\d+_\d+))_\d{4}'
  source_pattern: data/segthor_train_full/train/{patient}/GT.nii.gz

model:
  name: unet
  kwargs: {block: residual, deep_supervision: true}

loss:
  name: dice_ce
  kwargs:
    ce_idk: [0, 1, 2, 3, 4]
    dice_idk: [1, 2, 3, 4]
    ce_weight: 1.0
    dice_weight: 1.0

eval:
  classes: [1, 2, 3, 4]

wandb:
  mode: disabled

paths:
  metrics_category: registration
