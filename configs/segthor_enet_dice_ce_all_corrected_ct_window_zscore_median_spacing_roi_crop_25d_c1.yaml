# 2.5D version of segthor_enet_dice_ce_all_corrected_ct_window_zscore_median_spacing_roi_crop.yaml: each sample stacks the slice and its
# +-1 neighbours (same patient, edge slices repeated) as 3 input channels and still predicts only the centre slice.
# Differs from that config only in `experiment`, `notes` and `data.context` / `data.in_channels`. The preprocessing dict is identical,
# so it reuses the same data/sliced_<hash> (no re-slicing). Compare against the 2D baseline with src/aggregate.py.
experiment: segthor_enet_dice_ce_all_corrected_ct_window_zscore_median_spacing_roi_crop_25d_c1
notes: 2.5D (3 slices as channels, centre-slice target) ENet + CE (all classes) + soft Dice (foreground), corrected labels, median spacing + HU window + z-score + ROI crop/pad

data:
  context: 1
  in_channels: 3
  preprocess: {source_dir: data/segthor_part1_corrected, gt_version: corrected, retains: 5, fold: 0, seed: 0, resample: median, normalize: ct_window_zscore, crop: roi}
  source_pattern: data/segthor_part1_corrected/train/{patient}/GT.nii.gz

model:
  name: enet
  kwargs: {kernels: 8, factor: 2}

loss:
  name: dice_ce
  kwargs:
    ce_idk: [0, 1, 2, 3, 4]   # CE sees background
    dice_idk: [1, 2, 3, 4]
    ce_weight: 1.0
    dice_weight: 1.0

eval:
  classes: [1, 2, 3, 4]

wandb:
  mode: disabled
