# Loss comparison, variant 3: CE over the FOREGROUND classes only + soft Dice over the foreground, corrected labels.
# Same loss as configs/segthor_enet_dice_ce.yaml, on the corrected data.
experiment: segthor_enet_dice_ce_fg_corrected
notes: ENet + CE (foreground only) + soft Dice (foreground), corrected SEGTHOR labels

data:
  root: data/SEGTHOR_corrected
  source_pattern: data/segthor_part1_corrected/train/{patient}/GT.nii.gz

model:
  name: enet
  kwargs: {kernels: 8, factor: 2}

loss:
  name: dice_ce
  kwargs:
    ce_idk: [1, 2, 3, 4]   # background pixels contribute nothing to the CE term
    dice_idk: [1, 2, 3, 4]
    ce_weight: 1.0
    dice_weight: 1.0

eval:
  classes: [1, 2, 3, 4]   # aorta now has GT

wandb:
  mode: disabled
