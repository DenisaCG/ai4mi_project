experiment: full_cv4_resenc_ds_unet_dice_ce_25d_c1_strong_geometric_50ep_boundary_w008_fold1
seed: 0
device: cuda
notes: 2.5D (3 slices as channels) + fixed-weight boundary loss (weight 0.08) + strong
  geometric augmentation, 50 epochs; residual-encoder deep-supervised U-Net, constant
  LR, full preprocessing, 4-fold CV on the 40-patient SEGTHOR train set
data:
  root: data/sliced_d27e8eea
  preprocess:
    shape:
    - 256
    - 256
    retains: 10
    fold: 1
    seed: 0
    source_dir: data/segthor_train_full
    gt_version: corrected
    resample: median
    normalize: ct_window_zscore
    crop: roi
    num_folds: 4
  registration: null
  num_classes: 5
  class_names:
  - background
  - esophagus
  - heart
  - trachea
  - aorta
  label_scale: 63
  patient_regex: (Patient_\d+)_\d{4}
  in_channels: 3
  context: 1
  stride: 1
  batch_size: 8
  num_workers: 5
  augment:
  - name: random_rotation
    kwargs:
      p: 0.7
      degrees:
      - -15.0
      - 15.0
      fill: ct_window_low
  - name: random_scaling
    kwargs:
      p: 0.7
      scales:
      - 0.8
      - 1.2
      fill: ct_window_low
  - name: random_shift
    kwargs:
      p: 0.7
      max_fraction: 0.1
      fill: ct_window_low
  source_pattern: data/segthor_train_full/train/{patient}/GT.nii.gz
  test_source_pattern: null
model:
  name: unet
  kwargs:
    block: residual
    deep_supervision: true
loss:
  name: ce_dice_boundary
  kwargs:
    boundary_idk:
    - 1
    - 2
    - 3
    - 4
    boundary_weight: 0.08
    ce_idk:
    - 0
    - 1
    - 2
    - 3
    - 4
    dice_idk:
    - 1
    - 2
    - 3
    - 4
    ce_weight: 1.0
    dice_weight: 1.0
optim:
  name: adam
  kwargs:
    lr: 0.0005
    betas:
    - 0.9
    - 0.999
scheduler:
  name: none
  kwargs: {}
train:
  epochs: 50
  early_stop_patience: 0
  select_metric: val_dice_fg
  max_failed_batches: 5
  debug_samples: 0
  train_patients: 0
  presence_weight: 0.0
eval:
  classes:
  - 1
  - 2
  - 3
  - 4
wandb:
  mode: disabled
  entity: ''
  project: ai4mi-segthor
  tags: []
  image_every: 5
paths:
  run_root: runs
  metrics_dir: metrics
  metrics_category: null
