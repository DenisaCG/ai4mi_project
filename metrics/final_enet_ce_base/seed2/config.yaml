experiment: final_enet_ce_base
seed: 2
device: cuda
notes: Final run, the very base model (course-default ENet + CE, no preprocessing,
  256x256 slices) on all 40 train+val patients, 50 epochs, last epoch, predicts the
  20 test patients
data:
  root: data/sliced_c5b52fd5
  preprocess:
    shape:
    - 256
    - 256
    retains: 0
    fold: 0
    seed: 0
    source_dir: data/segthor_train_full
    gt_version: corrected
  registration: null
  num_classes: 5
  class_names:
  - background
  - esophagus
  - heart
  - trachea
  - aorta
  label_scale: 63
  patient_regex: (Patient_\d+)_\d{4}
  in_channels: 1
  context: 0
  batch_size: 8
  num_workers: 5
  augment: []
  source_pattern: null
  test_source_pattern: data/segthor_train_full/test/{patient}.nii.gz
model:
  name: enet
  kwargs:
    kernels: 8
    factor: 2
loss:
  name: cross_entropy
  kwargs:
    idk:
    - 0
    - 1
    - 2
    - 3
    - 4
optim:
  name: adam
  kwargs:
    lr: 0.0005
    betas:
    - 0.9
    - 0.999
scheduler:
  name: none
  kwargs: {}
train:
  epochs: 50
  select_metric: train_dice_fg
  max_failed_batches: 5
  debug_samples: 0
  train_patients: 0
  presence_weight: 0.0
eval:
  classes:
  - 1
  - 2
  - 3
  - 4
wandb:
  mode: disabled
  entity: ''
  project: ai4mi-segthor
  tags: []
  image_every: 5
paths:
  run_root: runs
  metrics_dir: metrics
