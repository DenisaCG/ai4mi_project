experiment: full_cv4_enet_tversky_ce_fold2
seed: 0
device: cuda
notes: ENet + CE (all classes) + soft Tversky (foreground, alpha 0.3, beta 0.7), same
  preprocessing, folds and seed 0 as full_cv4_enet_dice_ce
data:
  root: data/sliced_6f81632c
  preprocess:
    shape:
    - 256
    - 256
    retains: 10
    fold: 2
    seed: 0
    source_dir: data/segthor_train_full
    gt_version: corrected
    resample: median
    normalize: ct_window_zscore
    crop: roi
    num_folds: 4
  registration: null
  num_classes: 5
  class_names:
  - background
  - esophagus
  - heart
  - trachea
  - aorta
  label_scale: 63
  patient_regex: (Patient_\d+)_\d{4}
  in_channels: 1
  context: 0
  batch_size: 8
  num_workers: 5
  augment: []
  source_pattern: data/segthor_train_full/train/{patient}/GT.nii.gz
  test_source_pattern: null
model:
  name: enet
  kwargs:
    kernels: 8
    factor: 2
loss:
  name: tversky_ce
  kwargs:
    ce_idk:
    - 0
    - 1
    - 2
    - 3
    - 4
    tversky_idk:
    - 1
    - 2
    - 3
    - 4
    alpha: 0.3
    beta: 0.7
optim:
  name: adam
  kwargs:
    lr: 0.0005
    betas:
    - 0.9
    - 0.999
scheduler:
  name: none
  kwargs: {}
train:
  epochs: 25
  select_metric: val_dice_fg
  max_failed_batches: 5
  debug_samples: 0
  train_patients: 0
  presence_weight: 0.0
eval:
  classes:
  - 1
  - 2
  - 3
  - 4
wandb:
  mode: disabled
  entity: ''
  project: ai4mi-segthor
  tags: []
  image_every: 5
paths:
  run_root: runs
  metrics_dir: metrics
