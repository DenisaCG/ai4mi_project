experiment: full_cv4_resenc_ds_unet_dice_ce_25d_c1_fold2
seed: 0
device: cuda
notes: 2.5D (3 slices as channels, centre-slice target) residual-encoder U-Net (stem
  conv, 1/3/4/6/6/6 residual blocks per encoder stage, 1 conv per decoder stage, ResNet-D
  skips) with deep supervision (auxiliary heads at the decoder stages, weights 1,
  1/2, 1/4, ..., lowest resolution 0) + CE (all classes) + soft Dice (foreground),
  constant LR, full preprocessing (median spacing + HU window + z-score + ROI crop/pad),
  4-fold CV on the full 40-patient SEGTHOR train set
data:
  root: data/sliced_6f81632c
  preprocess:
    shape:
    - 256
    - 256
    retains: 10
    fold: 2
    seed: 0
    source_dir: data/segthor_train_full
    gt_version: corrected
    resample: median
    normalize: ct_window_zscore
    crop: roi
    num_folds: 4
  num_classes: 5
  class_names:
  - background
  - esophagus
  - heart
  - trachea
  - aorta
  label_scale: 63
  patient_regex: (Patient_\d+)_\d{4}
  in_channels: 3
  context: 1
  batch_size: 8
  num_workers: 5
  augment: []
  source_pattern: data/segthor_train_full/train/{patient}/GT.nii.gz
  test_source_pattern: null
model:
  name: unet
  kwargs:
    block: residual
    deep_supervision: true
loss:
  name: dice_ce
  kwargs:
    ce_idk:
    - 0
    - 1
    - 2
    - 3
    - 4
    dice_idk:
    - 1
    - 2
    - 3
    - 4
    ce_weight: 1.0
    dice_weight: 1.0
optim:
  name: adam
  kwargs:
    lr: 0.0005
    betas:
    - 0.9
    - 0.999
scheduler:
  name: none
  kwargs: {}
train:
  epochs: 25
  select_metric: val_dice_fg
  max_failed_batches: 5
  debug_samples: 0
  train_patients: 0
eval:
  classes:
  - 1
  - 2
  - 3
  - 4
wandb:
  mode: disabled
  entity: ''
  project: ai4mi-segthor
  tags: []
  image_every: 5
paths:
  run_root: runs
  metrics_dir: metrics
