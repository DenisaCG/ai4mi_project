experiment: full_cv4_unet_dice_ce_cosine_fold0
seed: 2
device: cuda
notes: plain 2D U-Net + CE (all classes) + soft Dice (foreground), cosine LR schedule
  (CosineAnnealingLR, T_max = 25 epochs, eta_min = 0.0 default, stepped per epoch
  from the base lr 5e-4), full preprocessing (median spacing + HU window + z-score
  + ROI crop/pad), 4-fold CV on the full 40-patient SEGTHOR train set
data:
  root: data/sliced_12749947
  preprocess:
    shape:
    - 256
    - 256
    retains: 10
    fold: 0
    seed: 0
    source_dir: data/segthor_train_full
    gt_version: corrected
    resample: median
    normalize: ct_window_zscore
    crop: roi
    num_folds: 4
  num_classes: 5
  class_names:
  - background
  - esophagus
  - heart
  - trachea
  - aorta
  label_scale: 63
  patient_regex: (Patient_\d+)_\d{4}
  in_channels: 1
  batch_size: 8
  num_workers: 5
  augment: []
  source_pattern: data/segthor_train_full/train/{patient}/GT.nii.gz
  test_source_pattern: null
model:
  name: unet
  kwargs: {}
loss:
  name: dice_ce
  kwargs:
    ce_idk:
    - 0
    - 1
    - 2
    - 3
    - 4
    dice_idk:
    - 1
    - 2
    - 3
    - 4
    ce_weight: 1.0
    dice_weight: 1.0
optim:
  name: adam
  kwargs:
    lr: 0.0005
    betas:
    - 0.9
    - 0.999
scheduler:
  name: cosine
  kwargs: {}
train:
  epochs: 25
  select_metric: val_dice_fg
  max_failed_batches: 5
  debug_samples: 0
eval:
  classes:
  - 1
  - 2
  - 3
  - 4
wandb:
  mode: disabled
  entity: ''
  project: ai4mi-segthor
  tags: []
  image_every: 5
paths:
  run_root: runs
  metrics_dir: metrics
